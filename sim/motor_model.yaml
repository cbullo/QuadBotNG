# Bring-up approximation, NOT identified motor constants or calibrated FOC.
# Torque = clamp(sign * gain * clamp(voltage, +/-voltage_limit)
#                - gain * back_emf * shaft_speed, +/-model_shaft_torque_limit).
model: linear_voltage_back_emf
voltage_limit: 28.0
shaft_torque_per_volt: 0.03
back_emf_volts_per_rad_s: 0.015
# Inferred from the sign of the production DriveTo mixing relative to encoder
# equations; must be checked against measured voltage/encoder response.
voltage_to_encoder_sign: -1
# Ideal corrected sensor output: calibration registers are stored but aren't
# applied a second time to ideal telemetry. No electrical/mechanical zero mixing.
encoder_zero_counts: 0
# Unmeasured lumped motor/sensor approximation. Kt = shaft_torque_per_volt * R;
# heat = (saturated shaft torque / Kt)^2 * R. No separate sensor lag yet.
thermal:
  ambient_c: 20.0
  initial_c: 20.0
  effective_resistance_ohm: 0.5
  heat_capacity_j_per_k: 20.0
  thermal_resistance_k_per_w: 8.0
serial_baud: 115200
transport_latency_us: 200
# Host-side rotor position hold for the known-pose standing scenario.
# Gains act on decoded rotor radians and radians/s, and output volts.
stance:
  p_volts_per_rad: 26.7
  d_volts_per_rad_s: 0.15
